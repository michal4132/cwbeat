# SPDX-License-Identifier: Apache-2.0

description: |
  WS9652A PMU battery ADC, a child of zgmicro,ws9652a-pmu. Channel 0 is
  the fixed battery conversion. Samples preserve the full register byte;
  effective resolution and voltage scale are unknown. Sequence resolution
  8 denotes only the raw-byte representation. No millivolt reference is
  supplied. Gain 1, internal reference and default acquisition retain the
  inherited analog configuration without making calibration claims.

compatible: "zgmicro,ws9652a-adc"

include: adc-controller.yaml

properties:
  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
