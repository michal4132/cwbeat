CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_PROMPT_UART="config0c> "
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_VT100_COLORS=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_LOG=n

# This image owns the test button. Do not start product consumers or peers.
CONFIG_INPUT=n
CONFIG_LED=n
CONFIG_ZBUS=n
CONFIG_CWBEAT_AUDIO=n
CONFIG_CWBEAT_STOCK_PEER=n
CONFIG_CWBEAT_BLUETOOTH=n
CONFIG_CWBEAT_POWER=n
CONFIG_CWBEAT_UI=n
